name: TidyMobile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TidyCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: Y5V8Y3BH9A
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TidyMobile:
    type: application
    platform: iOS
    sources: [App, MobileShared, Assets.xcassets]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Tidy
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        TidyKeychainGroup: $(AppIdentifierPrefix)com.tommymassaro.tidy.mobile.shared
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tommymassaro.tidy.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)com.tommymassaro.tidy.mobile.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommymassaro.tidy.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TidyCore
      - target: TidyShare
        embed: true
  TidyShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, MobileShared]
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: Tidy
        TidyKeychainGroup: $(AppIdentifierPrefix)com.tommymassaro.tidy.mobile.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Config/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tommymassaro.tidy.mobile]
        keychain-access-groups: [$(AppIdentifierPrefix)com.tommymassaro.tidy.mobile.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommymassaro.tidy.mobile.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: TidyCore
  TidyMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommymassaro.tidy.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TidyMobile
schemes:
  TidyMobile:
    build:
      targets:
        TidyMobile: all
    test:
      targets: [TidyMobileUITests]
